<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أهلاً يا أمي 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Cairo', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #050d1f 0%, #0a1e3d 50%, #061632 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    -webkit-user-select: none;
    user-select: none;
  }

  #login-box {
    background: rgba(30,90,180,0.08);
    backdrop-filter: blur(20px);
    padding: 50px 40px;
    border-radius: 24px;
    border: 1px solid rgba(100,180,255,0.15);
    text-align: center;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 25px 80px rgba(0,50,150,0.5);
    animation: fadeUp 0.8s ease;
    position: relative;
    overflow: hidden;
  }

  #login-box::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(74,158,255,0.15), transparent 60%);
    animation: rotate 15s linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  #login-box > * { position: relative; z-index: 1; }

  #login-box h1 {
    font-family: 'Amiri', serif;
    font-size: 34px;
    color: #7db9ff;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(125,185,255,0.5);
  }
  #login-box p {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 30px;
  }
  #login-box input {
    width: 100%;
    padding: 16px;
    background: rgba(100,180,255,0.05);
    border: 2px solid rgba(100,180,255,0.2);
    border-radius: 14px;
    font-size: 18px;
    text-align: center;
    outline: none;
    font-family: inherit;
    color: white;
    transition: 0.3s;
    letter-spacing: 6px;
    font-weight: 700;
  }
  #login-box input::placeholder {
    letter-spacing: 6px;
    font-weight: 400;
    color: #64748b;
  }
  #login-box input:focus {
    border-color: #7db9ff;
    background: rgba(100,180,255,0.08);
    box-shadow: 0 0 30px rgba(125,185,255,0.25);
  }
  #login-box button {
    margin-top: 20px;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #4a9eff, #1e5ac8);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: 0.3s;
    box-shadow: 0 8px 25px rgba(74,158,255,0.3);
  }
  #login-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(74,158,255,0.5);
  }
  #login-box button:active { transform: translateY(0); }

  .error {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 14px;
    display: none;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* جزيئات */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #7db9ff;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 10px #4a9eff;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    from { transform: translateY(100vh); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="login-box">
  <h1>أهلاً يا أمي</h1>
  <p>اكتبي كلمة السر عشان تدخلي 🌸</p>
  <input type="password" id="pass" placeholder="••••" maxlength="10" onkeypress="if(event.key==='Enter')checkPass()" autofocus>
  <button onclick="checkPass()">دخول</button>
  <p class="error" id="err">مش صح يا أمي، جربي تاني 🌸</p>
</div>

<script>
  // ============ الإعدادات ============
  const PASSWORD = "1986";

  // حماية
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  // جزيئات
  function makeParticles() {
    setInterval(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (8 + Math.random() * 8) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 16000);
    }, 400);
  }
  makeParticles();

  // ============ الدخول ============
  function checkPass() {
    const input = document.getElementById('pass').value.trim();
    if (input === PASSWORD) {
      // ✅ صح — احفظ الجلسة وروح للـ index
      sessionStorage.setItem('mom_auth', 'true');
      document.getElementById('login-box').style.transition = 'opacity 0.4s, transform 0.4s';
      document.getElementById('login-box').style.opacity = '0';
      document.getElementById('login-box').style.transform = 'scale(0.9)';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    } else {
      const err = document.getElementById('err');
      err.style.display = 'block';
      err.style.animation = 'none';
      void err.offsetWidth;
      err.style.animation = 'shake 0.4s ease';
      document.getElementById('pass').value = '';
      document.getElementById('pass').focus();
    }
  }
</script>
</body>
</html>
