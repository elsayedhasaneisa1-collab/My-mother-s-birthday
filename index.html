<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل سنة ونت طيبة يا أمي 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: #050d1f;
    overflow: hidden;
    color: white;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ===== شاشة الباسورد ===== */
  #login-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #050d1f 0%, #0a1e3d 50%, #061632 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #login-screen.hidden { opacity: 0; visibility: hidden; }

  #login-box {
    background: rgba(30,90,180,0.08);
    backdrop-filter: blur(20px);
    padding: 50px 40px;
    border-radius: 24px;
    border: 1px solid rgba(100,180,255,0.15);
    text-align: center;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 25px 80px rgba(0,50,150,0.5), 0 0 60px rgba(50,130,255,0.1);
    animation: fadeUp 0.8s ease;
  }
  #login-box h1 {
    font-family: 'Amiri', serif;
    font-size: 32px;
    color: #7db9ff;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(125,185,255,0.5);
  }
  #login-box p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
  #login-box input {
    width: 100%;
    padding: 15px;
    background: rgba(100,180,255,0.05);
    border: 2px solid rgba(100,180,255,0.2);
    border-radius: 14px;
    font-size: 16px;
    text-align: center;
    outline: none;
    font-family: inherit;
    color: white;
    transition: 0.3s;
    letter-spacing: 3px;
  }
  #login-box input:focus { border-color: #7db9ff; background: rgba(100,180,255,0.08); box-shadow: 0 0 30px rgba(125,185,255,0.2); }
  #login-box button {
    margin-top: 18px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #4a9eff, #1e5ac8);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: 0.3s;
    box-shadow: 0 8px 25px rgba(74,158,255,0.3);
  }
  #login-box button:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(74,158,255,0.5); }
  .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }

  /* ===== الموقع الرئيسي ===== */
  #main {
    display: none;
    width: 100%;
    height: 100vh;
    position: relative;
  }
  #main.show { display: block; }

  .slideshow { position: absolute; inset: 0; z-index: 0; }
  .slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.1);
    transition: opacity 2s ease, transform 8s ease;
    filter: brightness(0.35) blur(3px) hue-rotate(180deg);
  }
  .slide.active { opacity: 1; transform: scale(1); }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(5,15,35,0.85) 0%, rgba(10,30,65,0.7) 100%);
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
    text-align: center;
    overflow-y: auto;
  }

  .title {
    font-family: 'Amiri', serif;
    font-size: clamp(24px, 4vw, 44px);
    color: #7db9ff;
    margin-bottom: 15px;
    letter-spacing: 1px;
    text-shadow: 0 0 40px rgba(125,185,255,0.6);
    opacity: 0;
    animation: fadeIn 1.5s ease forwards 0.3s;
  }

  /* ===== عداد العمر ===== */
  .age-counter {
    background: rgba(15,40,90,0.5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(100,180,255,0.25);
    border-radius: 20px;
    padding: 18px 22px;
    margin-bottom: 15px;
    max-width: 780px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,20,80,0.6), inset 0 1px 0 rgba(125,185,255,0.1);
    opacity: 0;
    animation: fadeIn 1.5s ease forwards 0.6s;
  }
  .age-counter .age-label {
    font-family: 'Amiri', serif;
    font-size: clamp(13px, 1.6vw, 18px);
    color: #a8d0ff;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    line-height: 1.5;
  }
  .age-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .age-box {
    background: linear-gradient(180deg, rgba(74,158,255,0.1), rgba(30,90,200,0.05));
    border: 1px solid rgba(100,180,255,0.2);
    border-radius: 14px;
    padding: 12px 6px;
    transition: 0.3s;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 75px;
  }
  .age-box:hover {
    background: linear-gradient(180deg, rgba(74,158,255,0.2), rgba(30,90,200,0.1));
    border-color: rgba(125,185,255,0.5);
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(50,130,255,0.2);
  }
  .age-num {
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 1.6vw, 22px);
    color: #ffffff;
    text-shadow: 0 0 20px rgba(125,185,255,0.7);
    font-variant-numeric: tabular-nums;
    display: block;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.5px;
  }
  .age-num.flash {
    animation: flashNum 0.6s ease;
  }
  @keyframes flashNum {
    0%   { transform: translateY(0) scale(1); color: #ffffff; }
    40%  { transform: translateY(-6px) scale(1.08); color: #7db9ff; text-shadow: 0 0 30px #4a9eff; }
    100% { transform: translateY(0) scale(1); color: #ffffff; }
  }
  .age-name {
    font-size: clamp(9px, 1vw, 12px);
    color: #7aa5d8;
    margin-top: 5px;
    display: block;
    letter-spacing: 0.3px;
  }

  /* ===== رسالة "من يوم ما اتولدت" ===== */
  .birth-msg {
    background: linear-gradient(135deg, rgba(74,158,255,0.15), rgba(30,90,200,0.05));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(100,180,255,0.3);
    border-radius: 18px;
    padding: 16px 25px;
    margin-bottom: 15px;
    max-width: 780px;
    width: 100%;
    box-shadow: 0 15px 40px rgba(0,20,80,0.4), inset 0 1px 0 rgba(125,185,255,0.15);
    opacity: 0;
    animation: fadeIn 1.5s ease forwards 0.9s;
  }
  .birth-msg p {
    font-family: 'Amiri', serif;
    font-size: clamp(14px, 1.7vw, 20px);
    color: #b8d9ff;
    line-height: 1.7;
    font-style: italic;
  }

  /* ===== صندوق الجمل المتغيرة ===== */
  .quote-box {
    background: rgba(10,25,55,0.6);
    backdrop-filter: blur(20px);
    padding: 30px 35px;
    border-radius: 20px;
    border: 1px solid rgba(100,180,255,0.25);
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(125,185,255,0.1);
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .typewriter {
    font-family: 'Amiri', serif;
    font-size: clamp(16px, 2vw, 26px);
    color: #ffffff;
    max-width: 100%;
    line-height: 1.7;
    min-height: 2.5em;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 30px rgba(74,158,255,0.3);
  }
  .typewriter .cursor {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: #7db9ff;
    margin-right: 4px;
    vertical-align: middle;
    animation: blink 0.8s infinite;
    box-shadow: 0 0 12px #4a9eff;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== كلمة "اللي بعدو 🥳" ===== */
  .next-word {
    font-family: 'Cairo', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 2.8vw, 34px);
    background: linear-gradient(135deg, #7db9ff, #4a9eff, #1e5ac8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-top: 15px;
    opacity: 0;
    transform: scale(0.5) rotate(-5deg);
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 20px rgba(74,158,255,0.6));
  }
  .next-word.show {
    opacity: 1;
    transform: scale(1) rotate(0deg);
    animation: pulseNext 1s ease infinite alternate;
  }
  @keyframes pulseNext {
    from { filter: drop-shadow(0 0 15px rgba(74,158,255,0.5)); }
    to   { filter: drop-shadow(0 0 30px rgba(74,158,255,0.9)); }
  }

  .signature {
    font-family: 'Amiri', serif;
    font-size: clamp(15px, 1.7vw, 20px);
    color: #7db9ff;
    margin-top: 12px;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .signature.show { opacity: 1; }

  /* جزيئات */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #7db9ff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    box-shadow: 0 0 10px #4a9eff;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    from { transform: translateY(100vh); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* زر الموسيقى */
  #music-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(15,40,90,0.6);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(100,180,255,0.3);
    color: #7db9ff;
    font-size: 20px;
    cursor: pointer;
    z-index: 20;
    transition: 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  }
  #music-btn:hover {
    transform: scale(1.1);
    border-color: #7db9ff;
    box-shadow: 0 0 25px rgba(74,158,255,0.5);
  }
  #music-btn.playing { animation: pulse 2s ease infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,158,255,0.5); }
    50% { box-shadow: 0 0 0 15px rgba(74,158,255,0); }
  }

  @media (max-width: 700px) {
    .age-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .age-counter { padding: 14px 14px; }
    .quote-box { padding: 22px 18px; min-height: 120px; }
    .age-num { font-size: 14px; }
    .age-box { min-height: 65px; padding: 10px 4px; }
  }
  @media (max-width: 450px) {
    .age-grid { grid-template-columns: repeat(2, 1fr); }
    .age-num { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- شاشة الباسورد -->
<div id="login-screen">
  <div id="login-box">
    <h1>أهلاً يا أمي</h1>
    <p>اكتبي كلمة السر عشان تدخلي 🌸</p>
    <input type="password" id="pass" placeholder="••••" onkeypress="if(event.key==='Enter')checkPass()">
    <button onclick="checkPass()">دخول</button>
    <p class="error" id="err">مش صح يا أمي، جربي تاني 🌸</p>
  </div>
</div>

<!-- الموقع -->
<div id="main">
  <div class="slideshow" id="slideshow"></div>
  <div class="overlay"></div>

  <button id="music-btn" onclick="toggleMusic()" title="تشغيل/إيقاف الموسيقى">
    <span id="music-icon">🔇</span>
  </button>

  <div class="content">
    <h1 class="title">لأغلى إنسانة في الكون</h1>

    <!-- عداد العمر -->
    <div class="age-counter">
      <div class="age-label">🌷 عمرك يا أمي من يوم ما اتولدتي (1986) لحد اللحظة دي:</div>
      <div class="age-grid">
        <div class="age-box"><span class="age-num" id="c-years">0</span><span class="age-name">سنة</span></div>
        <div class="age-box"><span class="age-num" id="c-days">0</span><span class="age-name">يوم</span></div>
        <div class="age-box"><span class="age-num" id="c-hours">0</span><span class="age-name">ساعة</span></div>
        <div class="age-box"><span class="age-num" id="c-minutes">0</span><span class="age-name">دقيقة</span></div>
        <div class="age-box"><span class="age-num" id="c-seconds">0</span><span class="age-name">ثانية</span></div>
      </div>
    </div>

    <!-- رسالة "من يوم ما اتولدت" -->
    <div class="birth-msg">
      <p>✨ من يوم ما اتولدتي في 1/10/1986، والدنيا بقت أحلى... لأنها استلمت أجمل قلب فيها 🤍</p>
    </div>

    <!-- صندوق الجمل المتغيرة -->
    <div class="quote-box">
      <div class="typewriter" id="typewriter"></div>
      <div class="next-word" id="next-word">اللي بعدو 🥳</div>
      <div class="signature" id="signature">— ابنك اللي بيحبك 🤍</div>
    </div>
  </div>
</div>

<audio id="bg-music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  // ============ الإعدادات ============
  const PASSWORD = "1986";
  const BIRTH_DATE = new Date(1986, 9, 1); // 1 أكتوبر 1986

  const IMAGES = ["hala.png", "hala.png", "hala.png", "hala.png"];

  const MESSAGES = [
    "يا أمي، إنتي أول حاجة بحبها في الدنيا، وآخر حاجة بفكر فيها قبل ما أنام 🌙",
    "كل سهرة سهرتيها عشاني، وكل دعوة دعيتيها في سجودك، هي سر نجاحي في الدنيا ❤️",
    "شكراً على كل دمعة فرح شوفتيها في عنيكي، وكل حضن دفّاني لما الدنيا كانت تقسى عليّ 🤍",
    "هفضل أحاول أكون ابن يستاهل كل تعبك، كل يوم، لحد آخر يوم في عمري 🌷"
  ];

  // ============ حماية ============
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key === 'F12') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) {
      e.preventDefault(); return false;
    }
    if (e.ctrlKey && e.key.toUpperCase() === 'U') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toUpperCase() === 'S') { e.preventDefault(); return false; }
    if (e.ctrlKey && ['C','A'].includes(e.key.toUpperCase())) { e.preventDefault(); return false; }
  });
  document.addEventListener('dragstart', e => e.preventDefault());

  // ============ الدخول ============
  function checkPass() {
    const input = document.getElementById('pass').value.trim();
    if (input === PASSWORD) {
      document.getElementById('login-screen').classList.add('hidden');
      setTimeout(() => {
        document.getElementById('main').classList.add('show');
        init();
        startMusicAuto();
      }, 800);
    } else {
      document.getElementById('err').style.display = 'block';
      document.getElementById('pass').value = '';
    }
  }

  let currentIndex = 0;
  let typeTimer = null;
  let ageInterval = null;
  let messageTimer = null;

  function init() {
    buildSlides();
    makeParticles();
    startSlideshow();
    startAgeCounter();
    showNextMessage(0); // ابدأ أول رسالة
  }

  // ====== عداد العمر ======
  function startAgeCounter() {
    updateAge(true);
    if (ageInterval) clearInterval(ageInterval);
    ageInterval = setInterval(() => updateAge(false), 1000);
  }

  function updateAge(firstTime) {
    const now = new Date();
    const diff = now - BIRTH_DATE;

    const totalSeconds = Math.floor(diff / 1000);
    const totalMinutes = Math.floor(totalSeconds / 60);
    const totalHours   = Math.floor(totalMinutes / 60);
    const totalDays    = Math.floor(totalHours / 24);

    let years = now.getFullYear() - BIRTH_DATE.getFullYear();
    const m = now.getMonth() - BIRTH_DATE.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < BIRTH_DATE.getDate())) years--;

    setAgeValue('c-years', years, firstTime);
    setAgeValue('c-days', totalDays, firstTime);
    setAgeValue('c-hours', totalHours, firstTime);
    setAgeValue('c-minutes', totalMinutes, firstTime);
    setAgeValue('c-seconds', totalSeconds, firstTime);
  }

  function setAgeValue(id, value, skipAnim) {
    const el = document.getElementById(id);
    const formatted = value.toLocaleString('en-US');
    if (el.textContent !== formatted) {
      el.textContent = formatted;
      if (!skipAnim) {
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
      }
    }
  }

  // ====== الصور ======
  function buildSlides() {
    const container = document.getElementById('slideshow');
    IMAGES.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'slide' + (i === 0 ? ' active' : '');
      div.style.backgroundImage = `url('${img}')`;
      container.appendChild(div);
    });
    IMAGES.forEach(src => { const i = new Image(); i.src = src; });
  }

  let currentSlide = 0;
  function startSlideshow() {
    setInterval(() => {
      const slides = document.querySelectorAll('.slide');
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 9000);
  }

  // ====== الرسائل المتسلسلة ======
  function showNextMessage(index) {
    if (index >= MESSAGES.length) {
      // خلصت كل الرسائل، ابدأ من الأول
      index = 0;
    }

    const typeEl = document.getElementById('typewriter');
    const nextWordEl = document.getElementById('next-word');
    const sig = document.getElementById('signature');

    // إعادة تعيين
    sig.classList.remove('show');
    nextWordEl.classList.remove('show');
    typeEl.innerHTML = '<span class="cursor"></span>';
    typeEl.style.opacity = '1';

    clearTimeout(typeTimer);
    clearTimeout(messageTimer);

    // اكتب الرسالة
    let i = 0;
    const text = MESSAGES[index];
    function type() {
      if (i < text.length) {
        typeEl.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
        i++;
        typeTimer = setTimeout(type, 55);
      } else {
        // خلصت الرسالة
        setTimeout(() => sig.classList.add('show'), 300);
        // بعد ثانيتين، اظهر "اللي بعدو 🥳"
        setTimeout(() => nextWordEl.classList.add('show'), 1800);
        // بعد 4 ثواني، اختفي كل حاجة وابدأ اللي بعدها
        messageTimer = setTimeout(() => {
          typeEl.style.transition = 'opacity 0.5s';
          typeEl.style.opacity = '0';
          nextWordEl.classList.remove('show');
          sig.classList.remove('show');
          setTimeout(() => {
            typeEl.style.transition = 'none';
            showNextMessage(index + 1);
          }, 600);
        }, 4200);
      }
    }
    setTimeout(type, 300);
  }

  // ====== جزيئات ======
  function makeParticles() {
    setInterval(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (8 + Math.random() * 8) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 16000);
    }, 400);
  }

  // ====== الموسيقى ======
  const music = document.getElementById('bg-music');
  let musicPlaying = false;

  function toggleMusic() {
    const icon = document.getElementById('music-icon');
    const btn = document.getElementById('music-btn');

    if (musicPlaying) {
      music.pause();
      icon.textContent = '🔇';
      btn.classList.remove('playing');
      musicPlaying = false;
    } else {
      music.play().catch(err => console.log('خطأ:', err));
      icon.textContent = '🔊';
      btn.classList.add('playing');
      musicPlaying = true;
    }
  }

  function startMusicAuto() {
    music.volume = 0;
    music.play().then(() => {
      musicPlaying = true;
      document.getElementById('music-icon').textContent = '🔊';
      document.getElementById('music-btn').classList.add('playing');

      let vol = 0;
      const fade = setInterval(() => {
        vol += 0.02;
        if (vol >= 0.4) { vol = 0.4; clearInterval(fade); }
        music.volume = vol;
      }, 100);
    }).catch(() => {
      console.log('المتصفح منع التشغيل التلقائي');
    });
  }
</script>
</body>
</html>
